name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trustops
          POSTGRES_PASSWORD: trustops
          POSTGRES_DB: trustops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://trustops:trustops@localhost:5432/trustops
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Alembic migration (validates against Postgres)
        run: alembic upgrade head

      - name: Tests (pytest)
        run: pytest
